name: Staging container images

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "workers/render/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/staging-render-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: videocraft-container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/videocraft-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/videocraft-api:staging

      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/videocraft-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/videocraft-web:staging

      - name: Publish render worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/render/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/videocraft-render-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/videocraft-render-worker:staging
