name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: videocraft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: videocraft
          POSTGRES_USER: videocraft
          POSTGRES_DB: videocraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocraft -d videocraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
          DEBUG: "0"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://videocraft:videocraft@localhost:5432/videocraft
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:4566
      S3_BUCKET: videocraft-ci
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: videocraft
      S3_SECRET_ACCESS_KEY: videocraft-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tests render and decode real media: FFmpeg with libass, the caption font, and OpenCV 4 (Haar cascades) for reframing.
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install "opencv-python-headless>=4.8,<5" scikit-image numpy
      - run: npm install
      - name: Build, test and typecheck
        env:
          REFRAME_PYTHON: python
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E "^not ok|error TS|^\s+error: |AssertionError|Error: " check.log | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=@videocraft/web
      - run: python -m pip install -r workers/timeline/requirements.txt
      - run: python workers/timeline/protocol_test.py
      - name: Integration tests
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log
      - name: Report failing integration tests as annotations
        if: failure()
        run: |
          grep -E "^not ok|^\\s+error: |Expected|AssertionError" integration.log | head -20 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
