name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: videocraft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: videocraft
          POSTGRES_USER: videocraft
          POSTGRES_DB: videocraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocraft -d videocraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: videocraft
          MINIO_ROOT_PASSWORD: videocraft-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://videocraft:videocraft@localhost:5432/videocraft
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: videocraft-ci
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: videocraft
      S3_SECRET_ACCESS_KEY: videocraft-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=@videocraft/web
      - run: python -m pip install -r workers/timeline/requirements.txt
      - run: python workers/timeline/protocol_test.py
      - run: npm run test:integration
